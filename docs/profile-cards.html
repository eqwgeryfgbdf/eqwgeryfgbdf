<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile card source — Lung Yu-Cheng</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;color:#1d1d1f;background:#fff;width:max-content;--canvas:#fff;--surface:#f5f7fb;--border:#dce6f5;--blue:#0071e3;--muted:#6e6e73;--text:#1d1d1f}
body.dark{--canvas:#0d1117;--surface:#161b22;--border:#303b4b;--blue:#58a6ff;--muted:#a6b0bd;--text:#f0f3f6;color:var(--text);background:var(--canvas)}
.asset{background:var(--canvas);overflow:hidden}
.hero{width:1200px;height:320px;padding:8px}
.hero-panel{height:100%;border-radius:30px;background:#0062d6;color:#fff;display:flex;align-items:center;padding:46px 52px;gap:44px}
.portrait{width:186px;height:186px;border:5px solid #b9dbff;border-radius:50%;object-fit:cover;flex:none}
.hero-copy{min-width:0}.eyebrow{font-size:16px;letter-spacing:2px;font-weight:600;color:#c7e2ff;margin:0 0 13px}.name{font-size:54px;line-height:1.12;letter-spacing:-1.5px;font-weight:700;margin:0 0 15px}.name span{font-size:37px;font-weight:500;color:#c7e2ff;margin-left:14px;letter-spacing:0}.position{font-size:22px;line-height:1.5;margin:0;font-weight:500}.fields{font-size:19px;line-height:1.5;margin:15px 0 0;color:#e2f0ff}
.education{width:1200px;height:326px;padding:8px}
.education-panel{height:100%;border:2px solid var(--border);border-radius:28px;background:var(--surface);padding:28px 36px}
.school{height:126px;display:grid;grid-template-columns:58px 1fr;align-items:center;gap:22px}.school+.school{border-top:1px solid var(--border)}.school-icon{width:42px;height:42px;opacity:.9}.school-name{font-size:29px;font-weight:650;letter-spacing:-.5px;line-height:1.3;margin:0 0 6px}.school-meta{font-size:21px;line-height:1.45;margin:0;color:var(--muted)}.school-tag{font-size:16px;color:var(--blue);font-weight:600;margin-top:6px}
.button{height:80px;width:240px;padding:5px}.button-panel{height:70px;border-radius:36px;border:2px solid #c6dbf8;background:#f5f9ff;display:flex;align-items:center;justify-content:center;gap:13px;color:#0067d8;font-size:27px;font-weight:550;letter-spacing:.2px}.button img{width:27px;height:27px}.dark .button-panel{background:#17263b;border-color:#334f74;color:#8abdff}.button.cv{width:160px}.button.scholar{width:240px}.button.linkedin{width:260px}.button.email{width:210px}
.hero.mobile{width:390px;height:422px;padding:5px}.mobile .hero-panel{padding:24px 22px;gap:17px;border-radius:26px;flex-direction:column;text-align:center}.mobile .portrait{width:112px;height:112px;border-width:3px}.mobile .eyebrow{font-size:11px;letter-spacing:1.6px;margin:0 0 11px}.mobile .name{font-size:32px;line-height:1.1;margin-bottom:13px;letter-spacing:-1px}.mobile .name span{display:block;font-size:24px;margin:8px 0 0}.mobile .position{font-size:15px;line-height:1.45}.mobile .fields{font-size:13px;line-height:1.6;margin-top:13px}
.education.mobile{width:390px;height:440px;padding:5px}.mobile .education-panel{padding:12px 21px;border-radius:24px}.mobile .school{height:204px;display:block;padding:17px 0}.mobile .school-icon{width:26px;height:26px;margin-bottom:10px}.mobile .school-name{font-size:21px;line-height:1.25;letter-spacing:-.3px;margin-bottom:7px}.mobile .school-meta{font-size:15px;line-height:1.5}.mobile .school-tag{font-size:13px;margin-top:8px}
</style>
<main id="asset"></main>
<script>
const params=new URLSearchParams(location.search);
const kind=params.get('asset')||'hero';
const mobile=params.get('mobile')==='1';
document.body.classList.toggle('dark',params.get('theme')==='dark');
const root=document.getElementById('asset');
const icons='../assets/profile/source/icons/';
if(kind==='hero'){
root.className='asset hero'+(mobile?' mobile':'');
root.innerHTML=`<div class="hero-panel"><img class="portrait" src="../assets/profile/source/avatar.png" alt="Lung Yu-Cheng's GitHub avatar"><div class="hero-copy"><p class="eyebrow">RESEARCHER · INVENTOR · ENGINEER</p><h1 class="name">Lung Yu-Cheng <span lang="zh-Hant">龍禹丞</span></h1><p class="position">Master’s student · Artificial Intelligence Technology<br>National Taipei University of Technology</p><p class="fields">Computer Vision · Multimodal AI · Embedded Systems</p></div></div>`;
}else if(kind==='education'){
root.className='asset education'+(mobile?' mobile':'');
root.innerHTML=`<div class="education-panel"><div class="school"><img class="school-icon" src="${icons}graduation-cap.svg" alt=""><div><p class="school-name">National Taipei University of Technology</p><p class="school-meta">Artificial Intelligence Technology</p><div class="school-tag">MASTER’S STUDENT</div></div></div><div class="school"><img class="school-icon" src="${icons}graduation-cap.svg" alt=""><div><p class="school-name">Lunghwa University of Science and Technology</p><p class="school-meta">B.S. in Computer Information and Network Engineering</p><div class="school-tag">2022–2026 · IoT Technical Excellence Program</div></div></div></div>`;
}else{
const buttons={website:['Website','globe'],cv:['CV','file-lines'],scholar:['Scholar','graduation-cap'],linkedin:['LinkedIn','linkedin-in'],email:['Email','envelope']};
const [label,icon]=buttons[kind]||buttons.website;
root.className='asset button '+kind;
root.innerHTML=`<div class="button-panel"><img src="${icons}${icon}.svg" alt=""><span>${label}</span></div>`;
}
</script>
</html>
