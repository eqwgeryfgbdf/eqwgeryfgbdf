<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG profile card preview — Lung Yu-Cheng</title>
<style>html,body{margin:0;padding:0;width:max-content}body{background:#fff}body.dark{background:#0d1117}img{display:block}</style>
<main><img id="asset" alt="Profile card preview"></main>
<script>
const params = new URLSearchParams(location.search);
const allowed = ['hero','education','website','cv','scholar','linkedin','email'];
const kind = allowed.includes(params.get('asset')) ? params.get('asset') : 'hero';
const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
const mobile = params.get('mobile') === '1' && ['hero','education'].includes(kind);
document.body.classList.toggle('dark', theme === 'dark');
document.getElementById('asset').src = '../assets/profile/' + kind + (mobile ? '-mobile' : '') + '-' + theme + '.svg';
</script>
</html>
